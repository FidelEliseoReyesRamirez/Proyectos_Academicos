services:

  # -------------------------------------------------------
  # Base de datos PostgreSQL
  # -------------------------------------------------------
  sudosquad_db:
    image: postgres:16-alpine
    container_name: sudosquad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sudosquad_db
      POSTGRES_USER: sudosquad_user
      POSTGRES_PASSWORD: sudosquad_secret_2025
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - sudosquad_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sudosquad_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudosquad_user -d sudosquad_db"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -------------------------------------------------------
  # Apache Kafka — localhost:9092
  # -------------------------------------------------------
  sudosquad_kafka:
    image: apache/kafka:4.1.2
    container_name: sudosquad_kafka
    hostname: sudosquad_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://sudosquad_kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@sudosquad_kafka:29093"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    networks:
      - sudosquad_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # -------------------------------------------------------
  # pgAdmin — http://localhost:5051
  # -------------------------------------------------------
  sudosquad_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sudosquad_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sudosquad.dev
      PGADMIN_DEFAULT_PASSWORD: admin_2025
    ports:
      - "5051:80"
    depends_on:
      sudosquad_db:
        condition: service_healthy
    networks:
      - sudosquad_net
    volumes:
      - sudosquad_pgadmin_data:/var/lib/pgadmin

  # -------------------------------------------------------
  # Base de datos propia del microservicio de auditoria
  # -------------------------------------------------------
  sudosquad_auditoria_db:
    image: postgres:16-alpine
    container_name: sudosquad_auditoria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sudosquad_auditoria_db
      POSTGRES_USER: sudosquad_auditoria_user
      POSTGRES_PASSWORD: sudosquad_auditoria_secret_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - sudosquad_auditoria_pgdata:/var/lib/postgresql/data
      - ./services/auditoria-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sudosquad_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudosquad_auditoria_user -d sudosquad_auditoria_db"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # -------------------------------------------------------
  # Laravel principal — http://localhost:8000
  # -------------------------------------------------------
  sudosquad_laravel:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    container_name: sudosquad_laravel
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: pgsql
      DB_HOST: sudosquad_db
      DB_PORT: 5432
      DB_DATABASE: sudosquad_db
      DB_USERNAME: sudosquad_user
      DB_PASSWORD: sudosquad_secret_2025

      KAFKA_BROKERS: sudosquad_kafka:19092
      KAFKA_CLIENT_ID: sudosquad-laravel
      KAFKA_GROUP_ID: sudosquad-notifications
      KAFKA_TOPIC_PROYECTO_REGISTRADO: proyectos.registrados
      KAFKA_TOPIC_PROYECTO_ESTADO_ACTUALIZADO: proyectos.estado_actualizado
      KAFKA_TOPIC_PROYECTO_ACTUALIZADO: proyectos.actualizados
      KAFKA_TOPIC_PROYECTO_ELIMINADO: proyectos.eliminados
      KAFKA_TOPIC_PROYECTO_RESTAURADO: proyectos.restaurados
      KAFKA_TOPIC_USUARIOS_EVENTOS: usuarios.eventos
      KAFKA_TOPIC_AUTH_EVENTOS: auth.eventos
    depends_on:
      sudosquad_db:
        condition: service_healthy
      sudosquad_kafka:
        condition: service_healthy
    networks:
      - sudosquad_net
    command: >
      sh -c "
        composer install --no-interaction --prefer-dist &&
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env;
        fi &&
        if ! grep -q '^APP_KEY=base64:' .env 2>/dev/null; then
          php artisan key:generate --no-interaction --force;
        fi &&
        php artisan optimize:clear &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  # -------------------------------------------------------
  # Microservicio real de notificaciones
  # -------------------------------------------------------
  sudosquad_notificaciones:
    build:
      context: ./services/notificaciones-service
      dockerfile: Dockerfile
    container_name: sudosquad_notificaciones
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: sudosquad_kafka:19092
      KAFKA_CLIENT_ID: sudosquad-notificaciones
      KAFKA_GROUP_ID: sudosquad-notificaciones-service
      KAFKA_TOPIC_PROYECTO_REGISTRADO: proyectos.registrados
      KAFKA_TOPIC_PROYECTO_ESTADO_ACTUALIZADO: proyectos.estado_actualizado
      KAFKA_TOPIC_PROYECTO_ACTUALIZADO: proyectos.actualizados
      KAFKA_TOPIC_PROYECTO_ELIMINADO: proyectos.eliminados
      KAFKA_TOPIC_PROYECTO_RESTAURADO: proyectos.restaurados
      KAFKA_TOPIC_USUARIOS_EVENTOS: usuarios.eventos
      KAFKA_TOPIC_AUTH_EVENTOS: auth.eventos

      AUDIT_DB_HOST: sudosquad_auditoria_db
      AUDIT_DB_PORT: 5432
      AUDIT_DB_DATABASE: sudosquad_auditoria_db
      AUDIT_DB_USERNAME: sudosquad_auditoria_user
      AUDIT_DB_PASSWORD: sudosquad_auditoria_secret_2026
    depends_on:
      sudosquad_kafka:
        condition: service_healthy
    networks:
      - sudosquad_net

  # -------------------------------------------------------
  # Microservicio real de auditoria
  # -------------------------------------------------------
  sudosquad_auditoria:
    build:
      context: ./services/auditoria-service
      dockerfile: Dockerfile
    container_name: sudosquad_auditoria
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: sudosquad_kafka:19092
      KAFKA_CLIENT_ID: sudosquad-auditoria
      KAFKA_GROUP_ID: sudosquad-auditoria-service
      KAFKA_TOPIC_PROYECTO_ACTUALIZADO: proyectos.actualizados
      KAFKA_TOPIC_PROYECTO_ELIMINADO: proyectos.eliminados
      KAFKA_TOPIC_PROYECTO_RESTAURADO: proyectos.restaurados
      KAFKA_TOPIC_USUARIOS_EVENTOS: usuarios.eventos
      KAFKA_TOPIC_AUTH_EVENTOS: auth.eventos

      AUDIT_DB_HOST: sudosquad_auditoria_db
      AUDIT_DB_PORT: 5432
      AUDIT_DB_DATABASE: sudosquad_auditoria_db
      AUDIT_DB_USERNAME: sudosquad_auditoria_user
      AUDIT_DB_PASSWORD: sudosquad_auditoria_secret_2026
    depends_on:
      sudosquad_kafka:
        condition: service_healthy
      sudosquad_auditoria_db:
        condition: service_healthy
    networks:
      - sudosquad_net

  # -------------------------------------------------------
  # API de consulta del microservicio de auditoria
  # -------------------------------------------------------
  sudosquad_auditoria_api:
    build:
      context: ./services/auditoria-service
      dockerfile: Dockerfile
    container_name: sudosquad_auditoria_api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8081:8081"
    environment:
      AUDIT_DB_HOST: sudosquad_auditoria_db
      AUDIT_DB_PORT: 5432
      AUDIT_DB_DATABASE: sudosquad_auditoria_db
      AUDIT_DB_USERNAME: sudosquad_auditoria_user
      AUDIT_DB_PASSWORD: sudosquad_auditoria_secret_2026
    depends_on:
      sudosquad_auditoria_db:
        condition: service_healthy
    networks:
      - sudosquad_net
    command: php -S 0.0.0.0:8081 /app/server.php

  # -------------------------------------------------------
  # Vite / React — http://localhost:5173
  # -------------------------------------------------------
  sudosquad_vite:
    build:
      context: .
      dockerfile: docker/vite/Dockerfile
    container_name: sudosquad_vite
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - sudosquad_node_modules:/app/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    depends_on:
      - sudosquad_laravel
    networks:
      - sudosquad_net
    command: >
      sh -c "
        while [ ! -f vendor/autoload.php ]; do
          echo 'Esperando composer install de Laravel...';
          sleep 2;
        done &&
        npm install &&
        rm -rf node_modules/.vite &&
        npm run dev -- --host 0.0.0.0 --port 5173
      "

volumes:
  sudosquad_pgdata:
  sudosquad_pgadmin_data:
  sudosquad_auditoria_pgdata:
  sudosquad_node_modules:

networks:
  sudosquad_net:
    driver: bridge